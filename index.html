      .vn-dlg { background:rgba(6,4,14,0.97); border-top:1px solid #1a1530; padding:18px 26px 22px; min-height:155px; display:flex; flex-direction:column; justify-content:space-between; position:relative; z-index:5; }

      .vn-text { font-size:15px; line-height:1.85; color:#ddd0ff; min-height:46px; }
      .vn-text.narr { color:#888099; font-style:italic; }
      .vn-adv { position:absolute; bottom:18px; right:24px; background:transparent; border:1px solid #1e1a30; color:#3d3460; padding:6px 16px; border-radius:20px; font-family:'Lora',serif; font-size:13px; cursor:pointer; transition:all 0.18s; }
      .vn-adv:hover { border-color:#7c6fc4; color:#b69ef4; }
      .vn-choices { display:flex; flex-direction:column; gap:9px; margin-top:10px; }
      .vn-choice { background:transparent; border:1px solid #1e1a30; color:#c4b5fd; padding:10px 18px; border-radius:10px; font-family:'Lora',serif; font-size:14px; cursor:pointer; text-align:left; transition:all 0.18s; }
      .vn-choice:hover { background:#1e1a3028; border-color:#7c6fc4; }
      .vn-btn { background:transparent; border:1.5px solid #5b3fa0; color:#b69ef4; padding:12px 32px; border-radius:32px; font-family:'Lora',serif; font-size:14px; cursor:pointer; transition:all 0.18s; }
      .vn-btn:hover { background:#5b3fa018; border-color:#9b7ef0; }
      .vn-chapter { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:#4a3f6e; margin-bottom:8px; }
      .vn-title { font-size:22px; font-weight:500; color:#ddd0ff; margin-bottom:14px; line-height:1.35; }
      .vn-narr { font-size:14.5px; line-height:1.85; color:#b0a0d0; margin-bottom:16px; }
      .vn-narr em { color:#fda4af; font-style:normal; }
      .char-solo { position:absolute; bottom:0; right:5%; height:92%; object-fit:contain; filter:drop-shadow(-6px 0 16px rgba(255,255,255,0.08)); transition:opacity 0.4s; }
      .char-solo.center { right:auto; left:50%; transform:translateX(-50%); }
      .char-solo.left { right:auto; left:4%; }
      .char-left { position:absolute; bottom:0; left:4%; height:90%; object-fit:contain; transition:opacity 0.35s ease,filter 0.35s ease; filter:drop-shadow(0 0 12px rgba(255,255,255,0.06)); }
      .char-right { position:absolute; bottom:0; right:4%; height:90%; object-fit:contain; transition:opacity 0.35s ease,filter 0.35s ease; filter:drop-shadow(0 0 12px rgba(255,255,255,0.06)); }
      .char-active { opacity:1; filter:brightness(1) drop-shadow(0 0 12px rgba(255,255,255,0.15)); }
      .char-dim { opacity:0.3; filter:brightness(0.5); }
      .char-both { opacity:1; filter:brightness(1); }
      .char-hidden { opacity:0; }
      .chars-group { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:center; align-items:flex-end; }

    // ── Stars (reusable) ─────────────────────────────────────────────────────
    const STAR_DATA = Array.from({length:50},(_,i)=>({
      id:i, top:Math.random()*100, left:Math.random()*100,
      size:Math.random()*2.2+0.6, delay:Math.random()*5, dur:Math.random()*2.5+2,
    }));
    function Stars() {
      return (
        <div className="star-field">
          {STAR_DATA.map(s=>(
            <div key={s.id} className="star" style={{top:`${s.top}%`,left:`${s.left}%`,width:`${s.size}px`,height:`${s.size}px`,"--dur":`${s.dur}s`,"--delay":`${s.delay}s`}}/>
          ))}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════════════
    //  SCENE 1 — Wake up
    // ════════════════════════════════════════════════════════════════════════
    const S1_CSS = `
      .letter-paper { background:#fdf8ef; color:#2d1b00; border-radius:10px; padding:36px 28px 32px 48px; font-family:'Caveat',cursive; font-size:22px; line-height:1.65; text-align:left; margin-bottom:24px; position:relative; box-shadow:0 10px 48px rgba(0,0,0,0.45); }

      .letter-paper p { margin-bottom:14px; }
      .letter-paper p:last-child { margin-bottom:0; text-align:right; }
      .drive-wrap { display:flex; flex-direction:column; align-items:center; gap:18px; }
      .car-icon { font-size:44px; animation:carbounce 0.65s ease-in-out infinite alternate; }
      @keyframes carbounce { from{transform:translateY(0)} to{transform:translateY(-7px)} }
      .road-track { width:220px; height:6px; background:#1a1630; border-radius:3px; overflow:hidden; position:relative; }
      .road-dash { position:absolute; top:50%; left:-35%; width:28%; height:2px; background:#fbbf24; border-radius:1px; transform:translateY(-50%); animation:dashmove 1s linear infinite; }
      @keyframes dashmove { from{left:-35%} to{left:110%} }
      .phone-shell { background:#13111f; border:2px solid #3730a3; border-radius:32px; padding:36px 24px 28px; max-width:240px; margin:0 auto 28px; }
      .rdot { width:9px; height:9px; border-radius:50%; background:#818cf8; animation:rpulse 1.5s ease-in-out infinite; }
      .rdot:nth-child(2){animation-delay:0.2s} .rdot:nth-child(3){animation-delay:0.4s}
      @keyframes rpulse { 0%,100%{opacity:0.25;transform:scale(0.75)} 50%{opacity:1;transform:scale(1.2)} }
      .voicemail-card { background:#1e1b38; border-left:3px solid #818cf8; border-radius:0 12px 12px 0; padding:20px; text-align:left; margin-bottom:24px; }
    `;

    function Scene1({ onComplete }) {
      const [scene, setScene] = useState("bedroom");
      const [opacity, setOpacity] = useState(1);
      const [rings, setRings] = useState(0);
      const [showVM, setShowVM] = useState(false);

      const goTo = (next) => { setOpacity(0); setTimeout(()=>{setScene(next);setOpacity(1);},480); };

      useEffect(()=>{
        if(scene==="driving"){ const t=setTimeout(()=>goTo("arrived"),4000); return()=>clearTimeout(t); }
      },[scene]);

      useEffect(()=>{
        if(scene!=="calling"){setRings(0);setShowVM(false);return;}
        let n=0;
        const iv=setInterval(()=>{ n++; setRings(n); if(n>=3){clearInterval(iv);setTimeout(()=>setShowVM(true),1300);} },1700);
        return()=>clearInterval(iv);
      },[scene]);

      return (
        <>
          <style>{BASE_CSS+S1_CSS}</style>
          <div className="vn-root">
            <Stars/>
            <div style={{position:"relative",zIndex:1,maxWidth:460,width:"100%",padding:"28px 24px",textAlign:"center",transition:"opacity 0.48s ease",opacity}}>

              {scene==="bedroom" && <>
                <div style={{fontSize:42,marginBottom:14}}>🌙</div>
                <p className="vn-chapter">Chapter One</p>
                <h1 className="vn-title">Good morning, Wolfie.</h1>
                <p className="vn-narr">You open your eyes slowly.<br/>The room is quiet — that soft, <em>still-dark kind of quiet.</em><br/><br/>You reach over to the other side of the bed.<br/><br/>It's cold. Yashy's not there.</p>
                <p className="vn-narr" style={{color:"#fda4af"}}>There's a letter resting on his pillow.</p>
                <button className="vn-btn" onClick={()=>goTo("letter")}>📜 &nbsp;Read the letter</button>
              </>}

              {scene==="letter" && <>
                <div className="letter-paper">
                  <div className="letter-margin"/>
                  <p>Good morning, Wolfie 🐺</p>
                  <p>By the time you're reading this, I'm already there waiting for you.</p>
                  <p>Come find me —<br/><strong>The Starlight Ballroom, Starlight Lane.</strong></p>
                  <p>Don't overthink it. Just come. I promise it's worth it. 🌟</p>
                  <p>— Yashy 💙</p>
                </div>
                <button className="vn-btn" onClick={()=>goTo("choice")}>Set it down</button>
              </>}

              {scene==="choice" && <>
                <div style={{fontSize:36,marginBottom:16}}>💭</div>
                <h2 className="vn-title">What do you do?</h2>
                <div className="vn-choices" style={{alignItems:"center"}}>
                  <button className="vn-choice" style={{borderColor:"#818cf8",color:"#a5b4fc",maxWidth:300}} onClick={()=>goTo("calling")}>📞 &nbsp;Call him</button>
                  <button className="vn-choice" style={{borderColor:"#f9a8d4",color:"#fbcfe8",maxWidth:300}} onClick={()=>goTo("driving")}>🚗 &nbsp;Leave for the place</button>
                </div>
              </>}

              {scene==="calling" && <>

  }
  .narration {
    font-size: 14.5px; line-height: 1.9;
    color: #b0a0d0; margin-bottom: 18px;
  }
  .narration em { color: #fda4af; font-style: normal; }
  .btn {
    display: inline-block; background: transparent;
    border: 1.5px solid #5b3fa0; color: #b69ef4;
    padding: 13px 34px; border-radius: 32px;
    font-family: 'Lora', serif; font-size: 14px;
    cursor: pointer; transition: all 0.18s;
  }
  .btn:hover { background: #5b3fa018; border-color: #9b7ef0; color: #d0bcff; }

  .next-sub { font-size: 12px; color: #2e2850; margin-top: 28px; }
`;

// ── Root ────────────────────────────────────────────────────────────────────
function Scene3({onComplete}) {
  const [scene, setScene] = useState("ballroom");
  const [opacity, setOpacity] = useState(1);
  const [chosenHall, setChosenHall] = useState(null);

  const goTo = (next) => {
    setOpacity(0);
    setTimeout(() => { setScene(next); setOpacity(1); }, 480);
  };

  const pickHall = (hall) => {
    setChosenHall(hall);
    goTo("entering");
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="root">
        <div className="scene" style={{ opacity }}>
          {scene === "ballroom"  && <Ballroom  goTo={goTo} />}
          {scene === "see_halls" && <SeeHalls  goTo={goTo} pickHall={pickHall} />}
          {scene === "entering"  && <Entering  hall={chosenHall} goTo={goTo} />}
          {scene === "next"      && <Next />}
        </div>
      </div>
    </>
  );
}

// ── Scene: Ballroom ─────────────────────────────────────────────────────────
function Ballroom({ goTo }) {
  return (
    <div className="ballroom">
      {/* Structure */}
      <div className="broom-ceiling" />
      <div className="broom-floor" />
      <div className="broom-wallglow" />

      {/* Chandelier */}
      <div className="chandelier">
        <div className="chan-top" />
        <div className="chan-stem" />
        <div className="chan-body" />
        <div className="chan-drops">
          {[50,38,28,38,50].map((h, i) => (
            <div className="chan-drop" key={i}>
              <div className="chan-rod" style={{ height: h }} />
              <div className="chan-gem" style={{ animationDelay: `${i * 0.3}s` }} />
            </div>
          ))}
        </div>
      </div>
      <div className="chan-halo" />

      {/* Banner */}
      <div className="banner-area">
        <div className="banner-lights-row">
          {BLIGHTS.map((c, i) => (
            <div key={i} className="blight" style={{
              background: c, color: c,
              "--dur": `${1.2 + i * 0.15}s`,
              "--delay": `${i * 0.2}s`,
            }} />
          ))}
        </div>
        <div className="banner-rope" />
        <div className="banner-sign">🎉 &nbsp;Happy Birthday Lillie&nbsp; 🎉</div>
      </div>

      {/* Balloons */}
      {BALLOONS.map(b => (
        <div key={b.id} className="balloon" style={{
          left: b.left, bottom: b.bottom,
          width: b.width, height: b.height,
          background: b.color,
          boxShadow: `0 0 12px ${b.color}44`,
          "--dur": b.dur, "--delay": b.delay,
        }}>
          <div className="balloon-string" />
        </div>
      ))}

      {/* People */}
      {PEOPLE.map(p => (
        <div key={p.id} className="person" style={{
          left: p.left, "--dur": p.dur, "--delay": p.delay,
        }}>
          <div className="p-head" />
          <div className="p-body" />
        </div>
      ))}

      {/* Confetti */}
      {CONFETTI.map(c => (
        <div key={c.id} className="confetti-piece" style={{
          left: `${c.left}%`, top: 0,
          width: c.size, height: c.size * 0.5,
          background: c.color,
          transform: `rotate(${c.rotate}deg)`,
          "--dur": `${c.dur}s`,
          "--delay": `${c.delay}s`,
        }} />
      ))}

      {/* Bottom text */}
      <div className="broom-bottom">
        <p className="chapter-tag">Chapter Three</p>
        <h2 className="scene-title">The Starlight Ballroom.</h2>
        <p className="narration" style={{ fontStyle: "normal" }}>
          You step inside. The warmth hits you first —<br />
          golden light, laughter, music drifting softly through the air.<br />
          People you don't recognise smile at you as you pass.<br />
          And there, hanging across the ceiling — <em>your name.</em>
        </p>
        <button className="btn" onClick={() => goTo("see_halls")}>
          Look around further
        </button>
      </div>
    </div>
  );
}

// ── Scene: See Halls ────────────────────────────────────────────────────────
function SeeHalls({ goTo, pickHall }) {
  return (
    <div className="halls-wrap">
      <div style={{ fontSize: 38, marginBottom: 14 }}>🚪</div>
      <p className="chapter-tag">The ballroom</p>
      <h2 className="scene-title">Four corridors branch off from the main hall.</h2>
      <p className="narration" style={{ fontStyle: "normal" }}>
        Each one lit a little differently. Each one waiting.<br />
        Yashy said to find him — but first, it seems,<br />
        someone else is waiting to say hello.
      </p>
      <div className="halls-grid">
        {HALLS.map(h => (
          <button key={h.id} className={`hall-door ${h.cls}`} onClick={() => pickHall(h)}>
            <span className="h-icon">{h.icon}</span>
            <span className="h-name">{h.name}</span>
            <span className="h-hint">{h.hint}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Scene: Entering hall ────────────────────────────────────────────────────
function Entering({ hall, goTo }) {
  useEffect(() => {
    const t = setTimeout(() => goTo("next"), 3200);
    return () => clearTimeout(t);
  }, []);

  if (!hall) return null;

  return (
    <div className="entering-wrap">
      <div style={{ fontSize: 44, marginBottom: 18 }}>{hall.icon}</div>
      <p className="chapter-tag">You chose</p>
      <h2 className="scene-title">{hall.name}</h2>
      <p className="narration" style={{ fontStyle: "normal" }}>
        You walk toward the corridor.<br />
        The light shifts as you step inside —<br />
        <em>someone's already waiting.</em>
      </p>
      <div style={{ display: "flex", gap: 6, justifyContent: "center", marginTop: 8 }}>
        {[0,1,2].map(i => (
          <div key={i} style={{
            width: 5, height: 5, borderRadius: "50%",
            background: "#3d3460",
            animation: `ldpop 1.1s ${i * 0.18}s ease-in-out infinite`,
          }} />
        ))}
      </div>
      <style>{`
        @keyframes ldpop { 0%,100% { opacity:0.25; } 50% { opacity:1; } }
      `}</style>
    </div>
  );
}

// ── Scene: Placeholder for character encounters ─────────────────────────────
function Next() {
  return (
    <div style={{ maxWidth: 460, margin: "0 auto", padding: "40px 24px", textAlign: "center" }}>
      <div style={{ fontSize: 40, marginBottom: 14 }}>👣</div>
      <p className="chapter-tag">The corridor</p>
      <h2 className="scene-title">Footsteps ahead.</h2>
      <p className="narration" style={{ fontStyle: "normal" }}>
        The corridor glows softly around you.<br />
        The sound gets closer.<br /><br />
        <em>Someone's here.</em>
      </p>
      <p className="next-sub">— Character encounters coming soon —</p>
    </div>
  );
}

  { type: "him_choice", responses: {
    what:  "Yashy invited me. Couldn't say no to that.",
    wrong: "No no — you're at exactly the right place. Your boyfriend invited me.",
  }},
  { type: "him",  text: "And... a very happy birthday. 🎂" },
  { type: "her",  text: "OMG TYSMMM 😭😭" },

  { type: "choice", id: "gift_choice", prompt: "What do you do?", options: [

  { type: "outcome" },

const CSS = `

    font-family: 'Lora', Georgia, serif;
    color: #e8deff; overflow: hidden; position: relative;
  }

  .encounter {
    width: 100%; max-width: 900px;
    display: flex; flex-direction: column;
    height: 100vh; max-height: 700px;
    position: relative;
  }

  /* ── Stage (top area) ── */
  .stage {
    flex: 1; position: relative; overflow: hidden;
    background: linear-gradient(to bottom, #0a0615 0%, #160d28 60%, #1e1235 100%);
  }

  /* Corridor atmosphere */
  .stage-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 100%, rgba(139,92,246,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 100%, rgba(139,92,246,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Character portrait */
  .char-portrait {
    position: absolute;
    bottom: 0; right: 8%;
    height: 92%;
    object-fit: contain;
    transition: all 0.6s cubic-bezier(0.2, 0, 0.2, 1);
    filter: drop-shadow(-8px 0 24px rgba(139,92,246,0.25));
  }
  .char-portrait.hidden {
    opacity: 0; transform: translateX(40px);
  }
  .char-portrait.visible {
    opacity: 1; transform: translateX(0);
  }

  /* Gift box on stage */
  .gift-on-stage {
    position: absolute;
    bottom: 12%; left: 50%; transform: translateX(-50%);
    font-size: 64px;
    animation: giftFloat 2s ease-in-out infinite alternate;
    cursor: default;
  }
  @keyframes giftFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-10px); }
  }

  /* Outcome overlay */
  .outcome-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,6,20,0.88);
    padding: 32px 24px; text-align: center;
    z-index: 10;
  }
  .oak-quote {
    font-size: 17px; line-height: 1.75;
    color: #c4b5fd; font-style: italic;
    max-width: 420px; margin-bottom: 18px;
  }
  .oak-attr {
    font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; color: #4a3f6e;
    margin-bottom: 28px;
  }

  /* ── Dialogue box (bottom) ── */
  .dialogue-box {
    background: rgba(10,6,20,0.96);
    border-top: 1px solid #2a1f4a;
    padding: 22px 28px 24px;
    min-height: 160px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; z-index: 5;
  }

  .speaker-tag {
    font-size: 11px; letter-spacing: 2.5px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .speaker-tag.him  { color: #818cf8; }
  .speaker-tag.her  { color: #f9a8d4; }
  .speaker-tag.narr { color: #4a3f6e; }
  .speaker-tag.prompt { color: #a78bfa; }

  .dialogue-text {
    font-size: 15.5px; line-height: 1.8;
    color: #ddd0ff; min-height: 50px;
  }
  .dialogue-text.narr { color: #b0a0d0; font-style: italic; }

  /* Advance button */
  .advance-btn {

    background: transparent;
    border: 1px solid #3a2f5a; color: #6d5fa0;

function Encounter1({onComplete}) {
  const [step, setStep]         = useState(0);
  const [charVisible, setCharVisible] = useState(false);
  const [choices, setChoices]   = useState({});
  const [showGift, setShowGift] = useState(false);
  const [showOutcome, setShowOutcome] = useState(false);
  const [giftOpened, setGiftOpened]   = useState(false);
  const [putInBag, setPutInBag] = useState(false);
  const [done, setDone]         = useState(false);

  const current = SCRIPT[step];

  const advance = () => {
    const next = step + 1;
    if (next >= SCRIPT.length) return;
    const nextNode = SCRIPT[next];
    // Show character when "him" first appears
    if ((nextNode.type === "him" || nextNode.type === "him_choice") && !charVisible) {
      setCharVisible(true);
    }
    if (nextNode.type === "gift") setShowGift(true);
    if (nextNode.type === "outcome") { setShowOutcome(true); return; }
    if (nextNode.type === "choice" && nextNode.id === "gift_choice") setShowGift(false);
    setStep(next);
  };

  const makeChoice = (choiceId, value) => {
    setChoices(prev => ({ ...prev, [choiceId]: value }));
    if (choiceId === "gift_choice") {
      setGiftOpened(value === "open");
      setShowOutcome(true);
      return;
    }
    const next = step + 1;
    setStep(next);
  };

  // Resolve him_choice text
  const getHimChoiceText = () => {
    const c2val = choices["c2"] || "what";
    return current.responses?.[c2val] || "";
  };

  const renderDialogue = () => {
    if (!current) return null;

    if (current.type === "narration") return (
      <>
        <span className="speaker-tag narr">Narrator</span>
        <p className="dialogue-text narr">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "her") return (
      <>
        <span className="speaker-tag her">Wolfie</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "him") return (
      <>
        <span className="speaker-tag him">The Recruiter</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "him_choice") return (
      <>
        <span className="speaker-tag him">The Recruiter</span>
        <p className="dialogue-text">{getHimChoiceText()}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "choice") return (
      <>
        <span className="speaker-tag prompt">{current.prompt}</span>
        <div className="choices">
          {current.options.map(opt => (
            <button key={opt.value} className="choice-opt"
              onClick={() => makeChoice(current.id, opt.value)}>
              {opt.label}
            </button>
          ))}
        </div>
      </>
    );

    if (current.type === "gift") return (
      <>
        <span className="speaker-tag him">The Recruiter</span>
        <p className="dialogue-text">He holds out a small wrapped box. It's tied with a purple ribbon.</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    return null;
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="root">
        <div className="encounter">

          {/* Stage */}
          <div className="stage">
            <div className="stage-glow" />

            {/* Character */}
            <img
              src={CHAR_IMG}
              alt="The Recruiter"
              className={`char-portrait ${charVisible ? "visible" : "hidden"}`}
            />

            {/* Gift box */}
            {showGift && !showOutcome && (
              <div className="gift-on-stage">🎁</div>
            )}

            {/* Outcome overlay */}
            {showOutcome && (
              <div className="outcome-overlay">
                <div style={{ fontSize: 48, marginBottom: 20 }}>
                  {giftOpened ? "🎁" : "👜"}
                </div>
                {/* Path A: opened gift → Oak quote → put in bag → continue */}
                {giftOpened && !putInBag && (
                  <>
                    <p className="oak-quote">
                      You open the box. Inside is a small note from the Recruiter.<br /><br />
                      Then, from somewhere, Professor Oak's voice:<br /><br />
                      "There's a time and place for everything..."
                    </p>
                    <p className="oak-attr">— Professor Oak</p>
                    <button className="choice-opt" style={{ marginTop: 16, textAlign: "center" }}
                      onClick={() => setPutInBag(true)}>
                      👜 &nbsp;Put it in bag
                    </button>
                  </>
                )}

                {/* Path A continued: after putting in bag */}
                {giftOpened && putInBag && (
                  <>
                    <div style={{ fontSize: 36, marginBottom: 14 }}>👜</div>
                    <p className="oak-quote">You tuck everything safely into your bag.</p>
                    {!done ? (
                      <button className="continue-btn" onClick={() => setDone(true)}>
                        Keep walking →
                      </button>
                    ) : (
                      <p className="next-sub">— Next character coming soon —</p>
                    )}
                  </>
                )}

                {/* Path B: put in bag directly → no Oak quote, just continue */}
                {!giftOpened && (
                  <>
                    <div style={{ fontSize: 36, marginBottom: 14 }}>👜</div>
                    <p className="oak-quote">You smile and tuck it safely into your bag.</p>
                    {!done ? (
                      <button className="continue-btn" onClick={() => setDone(true)}>
                        Keep walking →
                      </button>
                    ) : (
                      <p className="next-sub">— Next character coming soon —</p>
                    )}
                  </>
                )}
              </div>
            )}
          </div>

          {/* Dialogue box */}
          {!showOutcome && (
            <div className="dialogue-box">
              {renderDialogue()}
            </div>
          )}

        </div>
      </div>
    </>
  );
}

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .root {
    min-height: 100vh;
    background: #0d0b1a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', Georgia, serif;
    color: #e8deff; overflow: hidden;
  }
  .encounter {
    width: 100%; max-width: 900px;
    display: flex; flex-direction: column;
    height: 100vh; max-height: 700px; position: relative;
  }

  /* Stage */
  .stage {
    flex: 1; position: relative; overflow: hidden;
    background: linear-gradient(to bottom, #0c0618 0%, #160d2a 55%, #1e1040 100%);
  }
  .stage-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 25% 100%, rgba(167,139,250,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 100%, rgba(249,168,212,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Spotlight on active speaker */
  .spotlight {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 100%;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.05) 0%, transparent 65%);
    pointer-events: none; transition: opacity 0.4s;
  }

  .char-portrait {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    height: 90%; object-fit: contain;
    transition: opacity 0.5s ease, transform 0.5s ease;
    filter: drop-shadow(0 0 20px rgba(167,139,250,0.2));
  }
  .char-portrait.hidden { opacity: 0; transform: translateX(-50%) translateY(20px); }
  .char-portrait.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Wish banner above dialogue */
  .wish-banner {
    position: absolute; top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,6,20,0.75);
    border: 1px solid #2a1f4a;
    border-radius: 30px; padding: 6px 20px;
    font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; color: #6d5fa0;
    white-space: nowrap;
    z-index: 6;
  }

  /* Gift */
  .gift-on-stage {
    position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%);
    font-size: 64px;
    animation: giftFloat 2s ease-in-out infinite alternate;
  }
  @keyframes giftFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-10px); }
  }

  /* Outcome */
  .outcome-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,6,20,0.9);
    padding: 32px 24px; text-align: center; z-index: 10;

    font-size: 16px; line-height: 1.8;
    color: #c4b5fd; font-style: italic;
    max-width: 420px; margin-bottom: 14px;

    background: rgba(10,6,20,0.97);
    border-top: 1px solid #2a1f4a;

    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; z-index: 5;

    font-size: 11px; letter-spacing: 2.5px;

  .next-sub { font-size: 12px; color: #2e2850; margin-top: 10px; }

  .wdot.active { background: #c4b5fd; border-color: #c4b5fd; box-shadow: 0 0 6px #c4b5fd; }

const WISH_STEPS   = SCRIPT.filter(s => s.type === "wish");
const WISH_MEMBERS = WISH_STEPS.map(s => s.speaker);

function Encounter2({onComplete}) {
  const [step, setStep]             = useState(0);
  const [charVisible, setCharVisible] = useState(false);
  const [showGift, setShowGift]     = useState(false);
  const [showOutcome, setShowOutcome] = useState(false);
  const [giftOpened, setGiftOpened] = useState(false);
  const [putInBag, setPutInBag]     = useState(false);
  const [done, setDone]             = useState(false);

  const current = SCRIPT[step];

  // Count how many wish steps we've passed
  const wishIndex = (() => {
    let count = 0;
    for (let i = 0; i < step; i++) if (SCRIPT[i].type === "wish") count++;
    return count;
  })();

  const advance = () => {
    const next = step + 1;
    if (next >= SCRIPT.length) return;
    const n = SCRIPT[next];
    if (!charVisible && (n.type === "him" || n.type === "group" || n.type === "wish")) setCharVisible(true);
    if (n.type === "gift") setShowGift(true);
    if (n.type === "outcome") { setShowOutcome(true); return; }
    if (n.type === "choice" && n.id === "gift_choice") setShowGift(false);
    setStep(next);
  };

  const makeChoice = (id, value) => {
    if (id === "gift_choice") {
      setGiftOpened(value === "open");
      setShowOutcome(true);
      return;
    }
    setStep(s => s + 1);
  };

  const speakerColor = (sp) => COLORS[sp] || "#ddd0ff";

  const inWishSection = current?.type === "wish";
  const completedWishes = SCRIPT.slice(0, step).filter(s => s.type === "wish").length;

  const renderDialogue = () => {
    if (!current) return null;

    if (current.type === "narration") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Narrator }}>Narrator</span>
        <p className="dialogue-text narr">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "her") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Wolfie }}>Wolfie</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "him" || current.type === "group" || current.type === "wish") return (
      <>
        {inWishSection && (
          <div className="wish-dots">
            {WISH_MEMBERS.map((m, i) => (
              <div key={m} className={`wdot ${i < completedWishes ? "done" : i === completedWishes ? "active" : ""}`} />
            ))}
          </div>
        )}
        <span className="speaker-tag" style={{ color: speakerColor(current.speaker) }}>
          {current.speaker}
        </span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    if (current.type === "choice") return (
      <>
        <span className="speaker-tag" style={{ color: "#a78bfa" }}>{current.prompt}</span>
        <div className="choices">
          {current.options.map(opt => (
            <button key={opt.value} className="choice-opt"
              onClick={() => makeChoice(current.id, opt.value)}>
              {opt.label}
            </button>
          ))}
        </div>
      </>
    );

    if (current.type === "gift") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Group }}>(G)I-DLE</span>
        <p className="dialogue-text">All five of them hold out a single box together, tied with a ribbon in five different colors.</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );

    return null;
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="root">
        <div className="encounter">

          {/* Stage */}
          <div className="stage">
            <div className="stage-glow" />
            <div className="spotlight" />

            {inWishSection && (
              <div className="wish-banner">🎤 birthday wishes</div>
            )}

            <img
              src={CHAR_IMG}
              alt="(G)I-DLE"
              className={`char-portrait ${charVisible ? "visible" : "hidden"}`}
            />

            {showGift && !showOutcome && (
              <div className="gift-on-stage">🎁</div>
            )}

            {showOutcome && (
              <div className="outcome-overlay">
                {giftOpened && !putInBag && (
                  <>
                    <p className="oak-quote">
                      You open it. Inside are five small handwritten notes, one from each of them.<br /><br />
                      Then, somewhere in the back of your mind, a voice:<br /><br />
                      "There's a time and place for everything..."
                    </p>
                    <p className="oak-attr">— Professor Oak</p>
                    <button className="choice-opt" style={{ marginTop: 12, textAlign: "center", maxWidth: 260 }}
                      onClick={() => setPutInBag(true)}>
                      Put it all in bag
                    </button>
                  </>
                )}
                {giftOpened && putInBag && (
                  <>
                    <p className="oak-quote">You fold the notes carefully and tuck them in your bag. Something to read again later.</p>
                    {!done
                      ? <button className="continue-btn" onClick={() => setDone(true)}>Keep walking</button>
                      : <p className="next-sub">— Next character coming soon —</p>}
                  </>
                )}
                {!giftOpened && (
                  <>
                    <p className="oak-quote">You tuck it into your bag. Something to look forward to later.</p>
                    {!done
                      ? <button className="continue-btn" onClick={() => setDone(true)}>Keep walking</button>
                      : <p className="next-sub">— Next character coming soon —</p>}
                  </>
                )}
              </div>
            )}
          </div>

          {/* Dialogue */}
          {!showOutcome && (
            <div className="dialogue-box">
              {renderDialogue()}
            </div>
          )}

        </div>
      </div>
    </>
  );
}

  { type:"him2",    speaker:"Tanjiro", text:"Anyway — I heard it is your birthday. Happy birthday, Wolfie. I hope today is everything you wanted." },
  { type:"him",     speaker:"Giyu",    text:"...Happy birthday." },
  { type:"him2",    speaker:"Tanjiro", text:"We got you something, actually." },

  // Gift
  { type:"gift" },
  { type:"choice", id:"gift_choice", prompt:"What do you do?", options:[
    { label:"Open it",       value:"open" },
    { label:"Put it in bag", value:"bag"  },
  ]},
  { type:"outcome" },

  // Goodbye
  { type:"her",     speaker:"Wolfie",  text:"Okay — I should go find Yashy now." },
  { type:"him",     speaker:"Giyu",    text:"If you find him, let me know. I need to have a word with him about that gate." },
  { type:"her",     speaker:"Wolfie",  text:"...okay." },
  { type:"end" },
];

const CSS = `

function Encounter3({onComplete}) {
  const [step, setStep]               = useState(0);
  const [showSlash, setShowSlash]     = useState(false);
  const [showGate, setShowGate]       = useState(false);
  const [showGift, setShowGift]       = useState(false);
  const [showOutcome, setShowOutcome] = useState(false);
  const [giftOpened, setGiftOpened]   = useState(false);
  const [putInBag, setPutInBag]       = useState(false);
  const [showEnd, setShowEnd]         = useState(false);
  const [done, setDone]               = useState(false);

  const current = SCRIPT[step];

  const advance = () => {
    const next = step + 1;
    if (next >= SCRIPT.length) return;
    const n = SCRIPT[next];
    if (n.type === "slash")       { setShowSlash(true); return; }
    if (n.type === "gate_reveal") { setShowGate(true);  setStep(next); return; }
    if (n.type === "gift")        { setShowGift(true); }
    if (n.type === "outcome")     { setShowOutcome(true); return; }
    if (n.type === "end")         { setShowEnd(true); return; }
    if (n.type === "choice" && n.id === "gift_choice") setShowGift(false);
    setStep(next);
  };

  const makeChoice = (id, value) => {
    if (id === "gift_choice") {
      setGiftOpened(value === "open");
      setShowOutcome(true);
      return;
    }
    setStep(s => s + 1);
  };

  // Determine which character is active
  const getCharState = () => {
    if (!current) return { giyu: "char-both", tanjiro: "char-both" };
    if (current.type === "him")  return { giyu: "char-active", tanjiro: "char-dim" };
    if (current.type === "him2") return { giyu: "char-dim",    tanjiro: "char-active" };
    if (current.type === "both") return { giyu: "char-both",   tanjiro: "char-both" };
    return { giyu: "char-both", tanjiro: "char-both" };
  };
  const { giyu: giyuCls, tanjiro: tanjiroCls } = getCharState();

  const renderDialogue = () => {
    if (!current) return null;
    if (current.type === "narration") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Narrator }}>Narrator</span>
        <p className="dialogue-text narr">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "her") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Wolfie }}>Wolfie</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "him" || current.type === "him2") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS[current.speaker] }}>{current.speaker}</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "both") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Both }}>Giyu + Tanjiro</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "choice") return (
      <>
        <span className="speaker-tag" style={{ color: "#a78bfa" }}>{current.prompt}</span>
        <div className="choices">
          {current.options.map(o => (
            <button key={o.value} className="choice-opt" onClick={() => makeChoice(current.id, o.value)}>
              {o.label}
            </button>
          ))}
        </div>
      </>
    );
    if (current.type === "gift") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Tanjiro }}>Tanjiro</span>
        <p className="dialogue-text">He holds out a small wrapped package. Giyu stands beside him, arms still crossed, but he nods once.</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "gate_reveal") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Tanjiro }}>Tanjiro</span>
        <p className="dialogue-text">He points to the image on the wall behind him — a glowing gate, crackling with light.</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    return null;
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="root">
        <div className="encounter">

          <div className="stage">
            <div className="stage-bg" />

            {/* Characters */}
            <img src={GIYU_IMG}    alt="Giyu"    className={`char-left  ${giyuCls}`} />
            <img src={TANJIRO_IMG} alt="Tanjiro" className={`char-right ${tanjiroCls}`} />

            {/* Gift */}
            {showGift && !showOutcome && <div className="gift-on-stage">&#127873;</div>}

            {/* Slash overlay */}
            {showSlash && (
              <div className="slash-overlay">
                <div className="slash-title">Second Form: Water Wheel</div>
                <div className="slash-line" />
                <div className="apple-cut">the apple splits clean in two</div>
                <button className="slash-continue" onClick={() => { setShowSlash(false); setStep(s => s + 2); }}>▶</button>
              </div>
            )}

            {/* Gate reveal overlay */}
            {showGate && current?.type === "gate_reveal" && (
              <div className="gate-panel">
                <img src={GATE_IMG} alt="The Gate" className="gate-img" />
                <p className="gate-caption">
                  "That gate. Yashy opened it and pulled us through before we could do anything."
                </p>
                <button className="gate-continue" onClick={() => { setShowGate(false); setStep(s => s + 1); }}>▶</button>
              </div>
            )}

            {/* Outcome overlay */}
            {showOutcome && (
              <div className="outcome-overlay">
                {giftOpened && !putInBag && (
                  <>
                    <p className="oak-quote">
                      You open it carefully. Inside is a small water hashira insignia charm — and a handwritten note from Tanjiro saying he hopes your year is as warm as sunlight.<br /><br />
                      Then, from somewhere — Professor Oak's voice:<br /><br />
                      "There's a time and place for everything..."
                    </p>
                    <p className="oak-attr">— Professor Oak</p>
                    <button className="choice-opt" style={{ marginTop: 12, textAlign: "center", maxWidth: 260 }}
                      onClick={() => setPutInBag(true)}>
                      Put it in bag
                    </button>
                  </>
                )}
                {giftOpened && putInBag && (
                  <>
                    <p className="oak-quote">You tuck it safely into your bag.</p>
                    {!done
                      ? <button className="continue-btn" onClick={() => { setDone(true); setShowOutcome(false); setStep(s => s + 1); }}>Keep going</button>
                      : null}
                  </>
                )}
                {!giftOpened && (
                  <>
                    <p className="oak-quote">You tuck it into your bag without opening it. Something to look forward to later.</p>
                    {!done
                      ? <button className="continue-btn" onClick={() => { setDone(true); setShowOutcome(false); setStep(s => s + 1); }}>Keep going</button>
                      : null}
                  </>
                )}
              </div>
            )}

            {/* End screen */}
            {showEnd && (
              <div className="end-screen">
                <p style={{ fontSize: 13, color: "#4a3f6e", letterSpacing: 3, textTransform: "uppercase", marginBottom: 12 }}>Leaving</p>
                <p style={{ fontSize: 16, color: "#b0a0d0", fontStyle: "italic", lineHeight: 1.8, maxWidth: 360, marginBottom: 8 }}>
                  You leave Giyu and Tanjiro behind — one of them already back to looking for demons, the other watching you go with that unreadable expression.
                </p>
                <p className="next-sub">— Next character coming soon —</p>
              </div>
            )}
          </div>

          {/* Dialogue box */}
          {!showOutcome && !showEnd && !showSlash && !(showGate && current?.type === "gate_reveal") && (
            <div className="dialogue-box">
              {renderDialogue()}
            </div>
          )}

        </div>
      </div>
    </>
  );
}

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .root {
    min-height: 100vh; background: #0d0b1a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', Georgia, serif; color: #e8deff; overflow: hidden;
  }
  .encounter {
    width: 100%; max-width: 900px;
    display: flex; flex-direction: column;
    height: 100vh; max-height: 700px; position: relative;
  }

  .stage {
    flex: 1; position: relative; overflow: hidden;
    background: linear-gradient(to bottom, #090810 0%, #0f0c1c 50%, #141020 100%);
  }
  .stage-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 65% 100%, rgba(148,163,184,0.07) 0%, transparent 55%);
    pointer-events: none;
  }

  .char-portrait {
    position: absolute;
    bottom: 0; right: 6%;
    height: 94%; object-fit: contain;
    transition: opacity 0.5s ease, filter 0.5s ease;
    filter: drop-shadow(-6px 0 18px rgba(148,163,184,0.12));
  }
  .char-portrait.visible { opacity: 1; }
  .char-portrait.hidden  { opacity: 0; transform: translateX(30px); }

  /* Subtle vignette left side */
  .vignette-left {
    position: absolute; top: 0; left: 0; bottom: 0; width: 40%;
    background: linear-gradient(to right, rgba(9,8,16,0.5) 0%, transparent 100%);
    pointer-events: none;
  }

  .gift-on-stage {
    position: absolute; bottom: 15%; left: 36%; transform: translateX(-50%);
    font-size: 52px; animation: giftFloat 2s ease-in-out infinite alternate; z-index: 5;
  }
  @keyframes giftFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-8px); }
  }

  .outcome-overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8,6,14,0.93);
    padding: 28px 24px; text-align: center;
  }
  .oak-quote {
    font-size: 15.5px; line-height: 1.85; color: #c4b5fd;
    font-style: italic; max-width: 400px; margin-bottom: 14px;
  }
  .oak-attr { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #4a3f6e; margin-bottom: 20px; }

  .end-screen {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8,6,14,0.93); text-align: center; padding: 28px;
  }

  .dialogue-box {
    background: rgba(8,6,14,0.97); border-top: 1px solid #1a1530;
    padding: 20px 28px 22px; min-height: 160px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; z-index: 5;
  }
  .speaker-tag { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 8px; }
  .dialogue-text { font-size: 15.5px; line-height: 1.8; color: #ddd0ff; min-height: 50px; }
  .dialogue-text.narr { color: #888099; font-style: italic; }
  .advance-btn {
    position: absolute; bottom: 20px; right: 26px;
    background: transparent; border: 1px solid #1e1a30; color: #3d3460;
    padding: 7px 18px; border-radius: 20px;
    font-family: 'Lora', serif; font-size: 13px; cursor: pointer; transition: all 0.18s;

  .choice-opt {
    background: transparent; border: 1px solid #1e1a30; color: #c4b5fd;

    font-family: 'Lora', serif; font-size: 14px;
    cursor: pointer; text-align: left; transition: all 0.18s;
  }
  .choice-opt:hover { background: #1e1a3020; border-color: #7c6fc4; }
  .continue-btn {
    display: inline-block; background: transparent;
    border: 1.5px solid #5b3fa0; color: #b69ef4;
    padding: 12px 32px; border-radius: 32px;
    font-family: 'Lora', serif; font-size: 14px;
    cursor: pointer; transition: all 0.18s; margin-top: 14px;
  }

  .next-sub { font-size: 12px; color: #2e2850; margin-top: 10px; }
`;

function Encounter4({onComplete}) {
  const [step, setStep]               = useState(0);
  const [charVisible, setCharVisible] = useState(false);
  const [showGift, setShowGift]       = useState(false);
  const [showOutcome, setShowOutcome] = useState(false);
  const [giftOpened, setGiftOpened]   = useState(false);
  const [putInBag, setPutInBag]       = useState(false);
  const [done, setDone]               = useState(false);
  const [showEnd, setShowEnd]         = useState(false);

  const current = SCRIPT[step];

  const advance = () => {
    const next = step + 1;
    if (next >= SCRIPT.length) return;
    const n = SCRIPT[next];
    if (!charVisible && (n.type === "him" || n.type === "him_choice")) setCharVisible(true);
    if (n.type === "gift")    { setShowGift(true); }
    if (n.type === "outcome") { setShowOutcome(true); return; }
    if (n.type === "end")     { setShowEnd(true); return; }
    if (n.type === "choice" && n.id === "gift_choice") setShowGift(false);
    setStep(next);
  };

  const [choices, setChoices] = useState({});

  const makeChoice = (id, value) => {
    if (id === "gift_choice") {
      setGiftOpened(value === "open");
      setShowOutcome(true);
      return;
    }
    setChoices(prev => ({ ...prev, [id]: value }));
    setStep(s => s + 1);
  };

  const renderDialogue = () => {
    if (!current) return null;

    if (current.type === "narration") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Narrator }}>Narrator</span>
        <p className="dialogue-text narr">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "her") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Wolfie }}>Wolfie</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "him") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Joonghyuk }}>Yoo Joonghyuk</span>
        <p className="dialogue-text">{current.text}</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    if (current.type === "him_choice") {
      const chosen = choices[current.id] || "a";
      const text = current.responses[chosen];
      return (
        <>
          <span className="speaker-tag" style={{ color: COLORS.Joonghyuk }}>Yoo Joonghyuk</span>
          <p className="dialogue-text">{text}</p>
          <button className="advance-btn" onClick={advance}>▶</button>
        </>
      );
    }
    if (current.type === "choice") return (
      <>
        <span className="speaker-tag" style={{ color: "#a78bfa" }}>{current.prompt}</span>
        <div className="choices">
          {current.options.map(o => (
            <button key={o.value} className="choice-opt" onClick={() => makeChoice(current.id, o.value)}>
              {o.label}
            </button>
          ))}
        </div>
      </>
    );
    if (current.type === "gift") return (
      <>
        <span className="speaker-tag" style={{ color: COLORS.Joonghyuk }}>Yoo Joonghyuk</span>
        <p className="dialogue-text">He just holds it out. No explanation, no ceremony. Just — here.</p>
        <button className="advance-btn" onClick={advance}>▶</button>
      </>
    );
    return null;
  };

  return (
    <>
      <style>{CSS}</style>
      <div className="root">
        <div className="encounter">
          <div className="stage">
            <div className="stage-bg" />
            <div className="vignette-left" />

            <img
              src={CHAR_IMG} alt="Yoo Joonghyuk"
              className={`char-portrait ${charVisible ? "visible" : "hidden"}`}
            />

            {showGift && !showOutcome && <div className="gift-on-stage">&#127873;</div>}

            {showOutcome && (
              <div className="outcome-overlay">
                {giftOpened && !putInBag && (
                  <>
                    <p className="oak-quote">
                      You go to open it — but then Professor Oak's voice appears from nowhere:<br /><br />
                      Then, from somewhere — Professor Oak's voice:<br /><br />
                      "There's a time and place for everything..."
                    </p>
                    <p className="oak-attr">— Professor Oak</p>
                    <button className="choice-opt" style={{ marginTop: 12, textAlign: "center", maxWidth: 260 }}
                      onClick={() => setPutInBag(true)}>
                      Put it in bag
                    </button>
                  </>
                )}
                {giftOpened && putInBag && (
                  <>
                    <p className="oak-quote">You tuck it carefully into your bag.</p>
                    {!done && <button className="continue-btn" onClick={() => { setDone(true); setShowOutcome(false); setStep(s => s + 1); }}>Keep going</button>}
                  </>
                )}
                {!giftOpened && (
                  <>
                    <p className="oak-quote">You put it in your bag without opening it. Something about opening it here feels wrong — like it deserves more than a hallway.</p>
                    {!done && <button className="continue-btn" onClick={() => { setDone(true); setShowOutcome(false); setStep(s => s + 1); }}>Keep going</button>}
                  </>
                )}
              </div>
            )}

            {showEnd && (
              <div className="end-screen">
                <p style={{ fontSize: 13, color: "#4a3f6e", letterSpacing: 3, textTransform: "uppercase", marginBottom: 14 }}>Leaving</p>
                <p style={{ fontSize: 16, color: "#888099", fontStyle: "italic", lineHeight: 1.9, maxWidth: 360, marginBottom: 10 }}>
                  You leave Joonghyuk behind — still standing there, arms crossed, already looking annoyed about the rematch he doesn't have yet.<br /><br />
                  Aliens, apparently. Who knew.
                </p>
                <p className="next-sub">— Next character coming soon —</p>
              </div>
            )}
          </div>

          {!showOutcome && !showEnd && (
            <div className="dialogue-box">{renderDialogue()}</div>
          )}
        </div>
      </div>
    </>
  );
}

const COLORS = {
  gongwoo:   "#818cf8",
  idle:      "#a78bfa",
  giyu:      "#60a5fa",
  tanjiro:   "#34d399",
  joonghyuk: "#94a3b8",
  yashy:     "#f9a8d4",
  wolfie:    "#fda4af",
  all:       "#fde68a",
};

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  .root {
    min-height: 100vh; background: #0d0b1a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', Georgia, serif; color: #e8deff; overflow: hidden;
  }
  .screen { width: 100%; max-width: 900px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  .stage {
    flex: 1; position: relative; overflow: hidden;
    background: linear-gradient(to bottom, #0a0818 0%, #120d24 55%, #1a1132 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .char-solo {
    position: absolute; bottom: 0; right: 5%;
    height: 92%; object-fit: contain;
    filter: drop-shadow(-6px 0 16px rgba(255,255,255,0.08));
  }
  .char-solo.center { right: auto; left: 50%; transform: translateX(-50%); }
  .chars-group {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: flex-end;
  }
  .char-group-img { height: 54vh; object-fit: contain; }
  .thought-overlay {
    position: absolute; inset: 0; background: rgba(8,6,18,0.75);
    display: flex; align-items: center; justify-content: center; z-index: 10; padding: 24px;
  }
  .thought-bubble {
    background: rgba(16,12,32,0.97); border: 1px dashed #3d3460;
    border-radius: 16px; padding: 22px 26px; max-width: 360px; text-align: center;
  }
  .thought-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .thought-text { font-size: 14.5px; line-height: 1.8; color: #888099; font-style: italic; }
  .thought-tap { font-size: 11px; color: #3d3460; margin-top: 10px; }
  .door-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .door-frame {
    width: 260px; background: #1a1230; border: 3px solid #3d2f60;
    border-radius: 8px 8px 0 0; padding: 16px;
    box-shadow: 0 0 40px rgba(93,63,160,0.25);
  }
  .door-knob { width: 56px; height: 56px; border-radius: 50%; background: #241848; margin: 0 auto 12px; border: 2px solid #3d2f60; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .posters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .poster {
    background: #fef3c7; color: #1e1200; font-family: 'Caveat', cursive; font-size: 11px; font-weight: 600;
    padding: 5px 4px; border-radius: 3px; text-align: center; border: 1px solid #d97706; line-height: 1.3;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }
  .poster:nth-child(odd)  { transform: rotate(-2deg); }
  .poster:nth-child(even) { transform: rotate(1.5deg); }
  .poster:nth-child(3)    { transform: rotate(-3deg); }
  .poster:nth-child(7)    { transform: rotate(2.5deg); }
  .checked-msg { font-size: 13px; color: #fda4af; font-style: italic; text-align: center; max-width: 260px; animation: fadein 0.5s ease; }
  .room-scene {
    width: 100%; height: 100%; background: radial-gradient(ellipse at 50% 80%, #1e1535 0%, #0d0b1a 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  }
  .deco-row { display: flex; gap: 28px; align-items: center; }
  .bell-wrap { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .bell-icon { font-size: 72px; animation: bellIdle 3s ease-in-out infinite; display: block; }
  @keyframes bellIdle { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-3deg)} }
  .bell-wrap.ringing .bell-icon { animation: bellRing 0.12s ease-in-out 8 alternate; }
  @keyframes bellRing { from{transform:rotate(-18deg)} to{transform:rotate(18deg)} }
  .bell-sign { background: #fef3c7; color: #b45309; font-family: 'Caveat', cursive; font-size: 14px; font-weight: 600; padding: 5px 14px; border-radius: 4px; border: 1px solid #d97706; margin-top: 8px; }
  .confetti-burst { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 10px; animation: burstIn 0.5s ease-out both; z-index: 5; }
  @keyframes burstIn { from{opacity:0;transform:translateX(-50%) scale(0.3)} to{opacity:1;transform:translateX(-50%) scale(1)} }
  .input-scene { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; gap:16px; text-align:center; }
  .input-prompt { font-size: 15px; color: #b0a0d0; line-height: 1.7; max-width: 340px; }
  .response-input { width:100%; max-width:400px; background:rgba(20,16,40,0.8); border:1.5px solid #3d2f60; border-radius:12px; padding:14px 18px; font-family:'Lora',serif; font-size:14.5px; color:#e8deff; resize:none; outline:none; min-height:90px; transition:border-color 0.2s; }

function Candle({ blown, onClick, idx }) {
  const colors = ["#fca5a5","#86efac","#93c5fd","#fde68a","#c4b5fd","#fdba74"];

    <div className={`candle ${blown ? "blown" : ""}`} onClick={!blown ? onClick : undefined}>

  );
}

              <button className="advance-btn" onClick={()=>{ goTo("dance"); setDanceStep(0); }}>▶</button>
            </div>
          </>}

          {scene === "dance" && <>
            <div className="stage">
              <div className="chars-group">
                {["joonghyuk","giyu","idle","tanjiro","gongwoo"].map(k => (
                  <img key={k} src={IMGS[k]} alt={k} className="char-group-img" />
                ))}
              </div>
            </div>
            <div className="dialogue-box">
              {danceStep < DANCE_LINES.length ? (()=>{
                const l = DANCE_LINES[danceStep];
                return <>
                  <span className="speaker-tag" style={{color:l.color}}>{l.speaker}</span>
                  <p className="dialogue-text">{l.text}</p>
                  {l.fw && <p className="fourth-wall">[ breaking the 4th wall — yes, he means the real you at home 🌙 ]</p>}
                  <button className="advance-btn" onClick={()=>{ if(danceStep+1>=DANCE_LINES.length) goTo("farewell"); else setDanceStep(s=>s+1); }}>▶</button>
                </>;
              })() : null}
            </div>
          </>}

          {scene === "farewell" && <>
            <div className="stage">
              <div className="farewell-scene">
                <p className="chapter-tag">until next time</p>
                <h2 className="scene-title">everyone says goodbye 💙</h2>
                <div className="farewell-grid">
                  {FAREWELL.map(({key,line})=>(
                    <div key={key} className="farewell-char">
                      <img src={IMGS[key]} alt={key} style={{borderColor:COLORS[key]}} />
                      <p className="farewell-line" style={{color:COLORS[key]}}>{line}</p>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:16,padding:"18px 24px",background:"rgba(249,168,212,0.06)",border:"1px solid rgba(249,168,212,0.12)",borderRadius:16,maxWidth:340}}>
                  <p style={{fontSize:13,color:"#4a3f6e",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>from yashy</p>
                  <p style={{fontSize:15.5,color:"#fda4af",fontStyle:"italic",lineHeight:1.85}}>
                    happy birthday wolfie 🐺<br/>
                    hope today was everything.<br/>
                    love u lots 💙
                  </p>
                </div>
                <p className="next-sub" style={{marginTop:8}}>everyone waves goodbye and disappears, one by one.</p>
                <button className="btn" style={{marginTop:16}} onClick={()=>goTo("gift_tease")}>head home</button>
              </div>
            </div>
          </>}


          {scene === "gift_tease" && <>
            <div className="stage" style={{flexDirection:"column",gap:20,padding:32,textAlign:"center"}}>
              <p style={{fontSize:13,color:"#4a3f6e",letterSpacing:3,textTransform:"uppercase"}}>wait a moment</p>
              <h2 style={{fontSize:26,fontWeight:500,color:"#ddd0ff",lineHeight:1.4}}>
                Something is still left...
              </h2>
              <p style={{fontSize:20,color:"#fde68a",fontFamily:"'Caveat',cursive",letterSpacing:1,animation:"fadein 0.8s 0.6s ease both",opacity:0}}>
                OPENING GIFTS 🎁
                <style>{".gift-reveal{animation:fadein 0.8s 0.6s ease both}"}</style>
              </p>
            </div>
            <div className="dialogue-box" style={{minHeight:"auto",padding:"16px 24px"}}>
              <span className="speaker-tag" style={{color:"#4a3f6e"}}>Narrator</span>
              <p className="dialogue-text narr">You get home. Your bag is full. You set it on the table and stare at it.</p>
              <button className="advance-btn" onClick={()=>goTo("gift_select")}>▶</button>
            </div>
          </>}

          {scene === "gift_select" && <>
            <div className="stage" style={{flexDirection:"column",gap:0,padding:"24px 20px",overflowY:"auto"}}>
              <p className="chapter-tag" style={{textAlign:"center",marginBottom:16}}>your bag</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,width:"100%",maxWidth:500}}>
                {GIFTS.map((g,i) => {
                  const opened = openedGifts.includes(i);
                  return (
                    <button key={i}
                      onClick={()=>{ if(!opened){ setCurrentGift(i); setGiftSub(0); goTo("gift_open"); } }}
                      style={{
                        background: opened ? "rgba(255,255,255,0.03)" : "transparent",
                        border: `1.5px solid ${opened ? "#2a2040" : g.color}`,
                        borderRadius:14, padding:"16px 12px",
                        color: opened ? "#3d3460" : g.color,
                        fontFamily:"'Lora',serif", fontSize:13,
                        cursor: opened ? "default" : "pointer",
                        textAlign:"center", transition:"all 0.2s",
                        opacity: opened ? 0.4 : 1,
                      }}>
                      <div style={{fontSize:22,marginBottom:6}}>
                        {opened ? "✓" : g.icon}
                      </div>
                      <div style={{fontWeight:500,marginBottom:3}}>{g.label}</div>
                      <div style={{fontSize:11,opacity:0.6}}>{opened ? "opened" : "tap to open"}</div>
                    </button>
                  );
                })}
              </div>
              {openedGifts.length === GIFTS.length && (
                <button className="btn" style={{marginTop:20}} onClick={()=>goTo("the_end")}>
                  that's all of them ✨
                </button>
              )}
            </div>
          </>}

          {scene === "gift_open" && currentGift !== null && (() => {
            const g = GIFTS[currentGift];

            const nextSub = () => {
              if (giftSub === 0) { setGiftSub(1); return; }
              if (giftSub === 1) { setGiftSub(2); return; }
              setOpenedGifts(prev => [...prev, currentGift]);
              setCurrentGift(null);
              goTo("gift_select");
            };

            return <>
              <div className="stage">
                <img src={IMGS.yashy} alt="Yashy" className="char-solo center" />
              </div>
              <div className="dialogue-box">
                {giftSub === 0 && <>
                  <span className="speaker-tag" style={{color:"#4a3f6e"}}>Narrator</span>
                  <p className="dialogue-text narr">{g.gift}</p>
                  <button className="advance-btn" onClick={nextSub}>▶</button>
                </>}
                {giftSub === 1 && <>
                  <span className="speaker-tag" style={{color:COLORS.wolfie}}>Wolfie</span>
                  <p className="dialogue-text">{g.reaction}</p>
                  <button className="advance-btn" onClick={nextSub}>▶</button>
                </>}
                {giftSub === 2 && <>
                  <span className="speaker-tag" style={{color:COLORS.yashy}}>Yashy</span>
                  <p className="dialogue-text">{g.yashyComment}</p>
                  <button className="advance-btn" onClick={nextSub}>▶</button>
                </>}
              </div>
            </>;
          })()}

          {scene === "the_end" && <>
            <div className="stage">
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:32,textAlign:"center"}}>
                <p style={{fontSize:13,color:"#4a3f6e",letterSpacing:3,textTransform:"uppercase"}}>the end</p>
                <h2 style={{fontSize:24,fontWeight:500,color:"#ddd0ff",lineHeight:1.5,maxWidth:380}}>
                  happy birthday, Wolfie.
                </h2>
                <p style={{fontSize:15,color:"#fda4af",fontStyle:"italic",lineHeight:1.85,maxWidth:340}}>
                  hope today was everything you wanted<br/>and a little more than you expected.<br/><br/>
                  love u lots 💙<br/>— Yashy
                </p>
                <p style={{fontSize:12,color:"#2e2850",marginTop:12}}>🌙 the end 🌙</p>
              </div>
            </div>
          </>}

        </div>
      </div>
    </>
  );
}


    // ════════════════════════════════════════════════════════════════════════
    //  APP — Chapter routing
    // ════════════════════════════════════════════════════════════════════════
    function App() {
      const [chapter, setChapter] = useState(0);
      const next = () => setChapter(c => c + 1);

      return (
        <>
          {chapter === 0 && <Scene1   onComplete={next}/>}
          {chapter === 1 && <Scene2   onComplete={next}/>}
          {chapter === 2 && <Scene3   onComplete={next}/>}
          {chapter === 3 && <Encounter1 onComplete={next}/>}
          {chapter === 4 && <Encounter2 onComplete={next}/>}
          {chapter === 5 && <Encounter3 onComplete={next}/>}
          {chapter === 6 && <Encounter4 onComplete={next}/>}
          {chapter === 7 && <Finale/>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
