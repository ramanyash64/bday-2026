  length: 50
}, (_, i) => ({
  id: i,
  top: Math.random() * 100,

  delay: Math.random() * 5,
  dur: Math.random() * 2.5 + 2

function Stars() {
  return React.createElement('div', {
    className: 'star-field'
  }, STAR_DATA.map(s => React.createElement('div', {
    key: s.id,
    className: 'star',
    style: {
      top: s.top + '%',
      left: s.left + '%',
      width: s.size + 'px',
      height: s.size + 'px',
      '--dur': s.dur + 's',
      '--delay': s.delay + 's'
    }
  })));
}

// ─── Global styles ─────────────────────────────────────────────────────────────
const CSSS1 = `
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .root {
    min-height: 100vh;
    background: #0d0b1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', Georgia, serif;
    color: #e8deff;
    overflow: hidden;
    position: relative;
  }

  /* ── Stars ── */
  .star-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) var(--delay, 0s) infinite alternate ease-in-out;
  }
  @keyframes twinkle {
    from { opacity: 0.1; }
    to   { opacity: 0.85; }
  }

  /* ── Scene wrapper ── */
  .scene {
    position: relative;
    z-index: 1;
    max-width: 460px;
    width: 100%;
    padding: 28px 24px;
    text-align: center;
    transition: opacity 0.48s ease;
  }

  /* ── Typography ── */
  .chapter-tag {
    font-family: 'Lora', serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a3f6e;
    margin-bottom: 10px;
  }
  .scene-title {
    font-size: 26px;
    font-weight: 500;
    color: #ddd0ff;
    margin-bottom: 26px;
    line-height: 1.3;
  }
  .narration {
    font-size: 15.5px;
    line-height: 1.9;
    color: #b0a0d0;
    font-weight: 400;
    margin-bottom: 28px;
  }
  .narration em {
    color: #fda4af;
    font-style: normal;
  }

  /* ── Primary button ── */
  .btn {
    display: inline-block;
    background: transparent;
    border: 1.5px solid #5b3fa0;
    color: #b69ef4;
    padding: 13px 34px;
    border-radius: 32px;
    font-family: 'Lora', serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
    letter-spacing: 0.3px;
  }
  .btn:hover {
    background: #5b3fa018;
    border-color: #9b7ef0;
    color: #d0bcff;
  }

  /* ── Letter ── */
  .letter {
    background: #fef9f0;
    color: #1e1200;
    border-radius: 10px;
    padding: 36px 28px 32px 48px;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    line-height: 1.6;
    text-align: left;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 0 10px 48px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.2);
  }
  .letter-margin {
    position: absolute;
    top: 0; bottom: 0;
    left: 38px;
    width: 1px;
    background: #fca5a533;
  }
  .letter p { margin-bottom: 14px; }
  .letter p:last-child { margin-bottom: 0; text-align: right; }
  .letter strong { font-weight: 700; }

  /* ── Choice buttons ── */
  .choices {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
  }
  .choice-btn {
    width: 100%;
    max-width: 310px;
    padding: 16px 24px;
    border-radius: 14px;
    border: 1.5px solid;
    background: transparent;
    font-family: 'Lora', serif;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    transition: background 0.18s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .choice-btn.call  { border-color: #818cf8; color: #a5b4fc; }
  .choice-btn.call:hover  { background: #818cf80f; }
  .choice-btn.leave { border-color: #f9a8d4; color: #fbcfe8; }
  .choice-btn.leave:hover { background: #f9a8d40f; }

  /* ── Phone ── */
  .phone {
    background: #100e20;
    border: 2px solid #312e81;
    border-radius: 34px;
    padding: 36px 24px 28px;
    max-width: 230px;
